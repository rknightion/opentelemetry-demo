# Publishes the `frontend` container with Grafana Faro instrumentation baked in
# to ghcr.io/rknightion/opentelemetry-demo.
#
# The frontend is the ONLY component this fork still patches, so it is the only
# image built here. Everything else runs upstream's published images straight
# from ghcr.io/open-telemetry/demo - see m7kni/rkps-awsinfra#273. If you add a
# patch to another service, add it to this fork's values.yaml imageOverride and
# extend this workflow rather than reviving a build-everything matrix.
#
# Lives alongside (not replacing) upstream's build-images.yml, which
# short-circuits on forks via `!github.event.repository.fork`. This one runs on
# the fork unconditionally.
name: Publish frontend image (rknightion fork)

on:
  push:
    branches: [main]
    paths:
      - 'src/frontend/**'
      - '.github/workflows/publish-frontend.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Extra tag to publish (in addition to the commit sha)
        required: false
        default: ''

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_REPO: ghcr.io/rknightion/opentelemetry-demo
  TAG_SUFFIX: frontend

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Load IMAGE_VERSION from .env
        # values.yaml pins <IMAGE_VERSION>-frontend, and updatecli bumps it in
        # lockstep, so the tag has to come from the same place upstream sets it.
        run: |
          grep -E '^IMAGE_VERSION=' .env >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
        with:
          image: tonistiigi/binfmt:master

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build and push frontend image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: ./
          file: ./src/frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.IMAGE_VERSION }}-${{ env.TAG_SUFFIX }}
            ${{ env.IMAGE_REPO }}:latest-${{ env.TAG_SUFFIX }}
            ${{ env.IMAGE_REPO }}:${{ github.sha }}-${{ env.TAG_SUFFIX }}
            ${{ github.event.inputs.tag && format('{0}:{1}-{2}', env.IMAGE_REPO, github.event.inputs.tag, env.TAG_SUFFIX) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
