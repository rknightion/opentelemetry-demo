# Keeps this fork up to date with open-telemetry/opentelemetry-demo.
#
# Fetches upstream, merges into a dated sync branch off our main, opens a PR. If
# the merge conflicts the PR is still opened, with the conflict markers
# committed, so it is visible rather than silently skipped.
#
# Since the v3.0.0 reset (m7kni/rkps-awsinfra#273) this fork carries only the
# Faro patch plus these two workflows, so conflicts should be rare. Keep it that
# way: the smaller the patch set, the cheaper the sync.
#
# All untrusted-ish values go through env rather than direct ${{ }}
# interpolation in run: blocks, so upstream's zizmor workflow stays quiet.
name: Sync from upstream

on:
  schedule:
    # Daily at 06:00 UTC - quiet window, fresh PR each day.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream ref to sync from'
        required: false
        default: 'main'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/open-telemetry/opentelemetry-demo.git
          git fetch upstream --tags

      - name: Compute branch and divergence
        id: prep
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
        run: |
          set -euo pipefail
          # Reject anything that isn't a plain ref name before it reaches a
          # git command built from it.
          case "$UPSTREAM_REF" in
            *[!A-Za-z0-9._/-]*|-*|'')
              echo "::error::refusing suspicious upstream ref: $UPSTREAM_REF"; exit 1 ;;
          esac
          UPSTREAM_SHA=$(git rev-parse "upstream/$UPSTREAM_REF")
          BRANCH="sync/upstream-$(date -u +%Y-%m-%d)-${UPSTREAM_SHA:0:12}"
          {
            echo "ref=$UPSTREAM_REF"
            echo "upstream_sha=$UPSTREAM_SHA"
            echo "branch=$BRANCH"
            echo "ahead=$(git rev-list --count "upstream/$UPSTREAM_REF..HEAD")"
            echo "behind=$(git rev-list --count "HEAD..upstream/$UPSTREAM_REF")"
          } >> "$GITHUB_OUTPUT"

      - name: Nothing to sync
        if: steps.prep.outputs.behind == '0'
        run: echo "::notice::Fork is already up to date with upstream."

      - name: Create sync branch and attempt merge
        id: merge
        if: steps.prep.outputs.behind != '0'
        env:
          BRANCH: ${{ steps.prep.outputs.branch }}
          UPSTREAM_REF: ${{ steps.prep.outputs.ref }}
        run: |
          set -euo pipefail
          git checkout -b "$BRANCH"
          if git merge --no-edit "upstream/$UPSTREAM_REF"; then
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflicts=true" >> "$GITHUB_OUTPUT"
            # Commit the conflict markers so a reviewer can see what needs doing.
            git add -A
            git commit --no-verify -m "merge: upstream/$UPSTREAM_REF (CONFLICTS)" || true
          fi
          git push origin "$BRANCH" --force-with-lease

      - name: Open PR
        if: steps.prep.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.prep.outputs.branch }}
          UPSTREAM_REF: ${{ steps.prep.outputs.ref }}
          UPSTREAM_SHA: ${{ steps.prep.outputs.upstream_sha }}
          AHEAD: ${{ steps.prep.outputs.ahead }}
          BEHIND: ${{ steps.prep.outputs.behind }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        run: |
          set -euo pipefail
          BODY=$(cat <<'EOF'
          Automated sync from `open-telemetry/opentelemetry-demo`.

          - Upstream ref: `UPSTREAM_REF_` at `UPSTREAM_SHA_`
          - Fork is **BEHIND_** behind, **AHEAD_** ahead
          - Merge conflicts: **CONFLICTS_**

          On conflict, resolve locally:
          `git fetch origin BRANCH_ && git checkout BRANCH_ && git reset --hard origin/main && git merge upstream/UPSTREAM_REF_`

          The only fork-owned files that can conflict:
          - `src/frontend/utils/telemetry/FaroInit.ts` - Faro RUM init
          - `src/frontend/pages/_app.tsx` / `_document.tsx` - Faro wiring
          - `src/frontend/package.json` - the `@grafana/faro-web-sdk` dep
          - `.env` / `compose.yaml` - FARO_* passthrough
          - `.github/workflows/publish-frontend.yml`, `.github/workflows/sync-upstream.yml`

          Generated by `sync-upstream.yml`.
          EOF
          )
          BODY=${BODY//UPSTREAM_REF_/$UPSTREAM_REF}
          BODY=${BODY//UPSTREAM_SHA_/$UPSTREAM_SHA}
          BODY=${BODY//BRANCH_/$BRANCH}
          BODY=${BODY//BEHIND_/$BEHIND}
          BODY=${BODY//AHEAD_/$AHEAD}
          BODY=${BODY//CONFLICTS_/${CONFLICTS:-false}}
          gh pr create \
            --title "chore: sync from upstream ($(date -u +%Y-%m-%d))" \
            --body "$BODY" \
            --base main \
            --head "$BRANCH" \
            --label "upstream-sync" \
          || gh pr edit "$BRANCH" --add-label "upstream-sync"
